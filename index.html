<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pangea interactiva — Khaylem</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 12px 16px;
        background: #0b3b3b;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
      }
      #controls {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      button {
        background: #fff;
        color: #0b3b3b;
        border-radius: 6px;
        padding: 6px 10px;
        border: 0;
        cursor: pointer;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(
          180deg,
          #87ceeb 0%,
          #a0d8ff 60%,
          #f8f9fa 100%
        );
      }
      .stage {
        width: 92vw;
        max-width: 1100px;
        height: 72vh;
        background: transparent;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(2, 18, 24, 0.15);
        position: relative;
        overflow: hidden;
      }
      svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .land {
        fill: #caa26d;
        stroke: #8a5f39;
        stroke-width: 1;
      }
      .piece {
        transition: transform 800ms cubic-bezier(0.2, 0.9, 0.3, 1),
          opacity 500ms;
        transform-origin: center;
      }
      .glow {
        filter: drop-shadow(0 6px 16px rgba(30, 60, 90, 0.25));
      }
      .floating path {
        filter: drop-shadow(0 10px 18px rgba(8, 24, 32, 0.25));
        transition: transform 1.2s, opacity 1s;
      }
      .piece {
        transition: transform 800ms cubic-bezier(0.2, 0.9, 0.3, 1),
          opacity 500ms;
        transform-origin: center center;
      }
      .info {
        position: absolute;
        left: 12px;
        bottom: 12px;
        background: rgba(255, 255, 255, 0.9);
        padding: 10px;
        border-radius: 8px;
        font-size: 13px;
        color: #062c33;
        max-width: 320px;
      }
      .label {
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto,
          "Helvetica Neue", Arial;
        font-size: 18px;
        fill: #fff;
        stroke: #06343a;
        stroke-width: 2px;
        paint-order: stroke;
        text-anchor: middle;
        dominant-baseline: middle;
        pointer-events: none;
      }
      /* legend removed per user request */
      .reset-small {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fff;
        padding: 6px 8px;
        border-radius: 6px;
      }
      @media (max-width: 600px) {
        .info {
          max-width: 90vw;
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body style="background: #000; overflow: hidden; color: #fff">
    <div
      id="stage"
      class="stage"
      style="width: 100vw; height: 100vh; max-width: none; border-radius: 0"
    >
      <!-- starry background -->
      <div
        id="stars"
        style="position: absolute; inset: 0; pointer-events: none; z-index: 0"
      ></div>
      <!-- top controls -->
      <div
        style="
          position: absolute;
          left: 12px;
          top: 12px;
          z-index: 30;
          display: flex;
          gap: 8px;
          align-items: center;
        "
      >
        <button id="reset">Reiniciar</button>
        <button id="hint" class="reset-small">Ayuda</button>
      </div>
      <!-- legend removed (user requested) -->
      <!-- SVG: continentes como grupos; cada continente contiene piezas (paths) -->
      <svg id="svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid meet">
        <defs>
          <filter id="soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="b" />
            <feOffset in="b" dx="0" dy="6" result="o" />
            <feBlend in="SourceGraphic" in2="o" />
          </filter>

          <!-- Degradado para las tierras (verde -> marrón) -->
          <linearGradient id="landGrad" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#739f4a" />
            <stop offset="50%" stop-color="#9bb85c" />
            <stop offset="100%" stop-color="#caa26d" />
          </linearGradient>

          <!-- Textura sutil (menos intensa para evitar aspecto esponjoso) -->
          <filter id="landNoise" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.06"
              numOctaves="2"
              stitchTiles="stitch"
              result="noise"
            />
            <feColorMatrix
              in="noise"
              type="saturate"
              values="0"
              result="nGray"
            />
            <feComponentTransfer in="nGray">
              <feFuncA type="table" tableValues="0 0.08" />
            </feComponentTransfer>
            <feBlend in="SourceGraphic" in2="nGray" mode="multiply" />
          </filter>

          <!-- Iluminación para dar relieve sutil -->
          <filter
            id="landLighting"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%"
            filterUnits="objectBoundingBox"
          >
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur" />
            <feSpecularLighting
              in="blur"
              surfaceScale="2"
              specularConstant="0.2"
              specularExponent="20"
              result="spec"
            >
              <fePointLight x="-100" y="-200" z="300" />
            </feSpecularLighting>
            <feComposite
              in="spec"
              in2="SourceAlpha"
              operator="in"
              result="specMask"
            />
            <feBlend in="SourceGraphic" in2="specMask" mode="overlay" />
          </filter>
        </defs>

        <!-- Fondo oceánico (base) -->
        <rect x="0" y="0" width="1200" height="800" fill="transparent" />

        <!-- Grupo que contiene la Pangea (varios continentes superpuestos) -->
        <g id="pangea" transform="translate(220,120)">
          <!-- Africa -->
          <g
            class="continent"
            data-id="africa"
            data-name="África"
            transform="translate(80,120)"
          >
            <path
              class="land piece"
              d="M30 10 C80 0 140 10 170 50 C200 90 190 150 140 180 C90 210 30 200 10 160 C-10 120 0 60 30 10 Z"
            />
            <text class="label">África</text>
          </g>

          <!-- Europa -->
          <g
            class="continent"
            data-id="europa"
            data-name="Europa"
            transform="translate(320,40)"
          >
            <path
              class="land piece"
              d="M20 20 C60 0 110 5 140 30 C165 50 170 90 150 110 C130 130 90 130 60 120 C30 110 10 70 20 20 Z"
            />
            <text class="label">Europa</text>
          </g>

          <!-- Asia -->
          <g
            class="continent"
            data-id="asia"
            data-name="Asia"
            transform="translate(460,20)"
          >
            <path
              class="land piece"
              d="M10 10 C80 -10 160 0 220 30 C280 60 300 140 260 200 C220 260 140 280 80 250 C30 220 5 130 10 10 Z"
            />
            <text class="label">Asia</text>
          </g>

          <!-- America (Norte + Sur en una sola imagen) -->
          <g
            class="continent"
            data-id="america"
            data-name="América"
            transform="translate(10,60)"
          >
            <path
              class="land piece"
              d="M40 10 C100 0 160 10 190 50 C230 100 210 190 170 240 C130 290 70 320 20 300 C-20 280 -10 180 10 120 C20 90 30 50 40 10 Z"
            />
            <!-- two labels: Norteamérica y Sudamérica -->
            <text class="label" data-sub="norte">Norteamérica</text>
            <text class="label" data-sub="sur">Sudamérica</text>
          </g>

          <!-- Antártida -->
          <g
            class="continent"
            data-id="antartida"
            data-name="Antártida"
            transform="translate(360,360)"
          >
            <path
              class="land piece"
              d="M10 20 L190 20 L220 60 L190 110 L120 120 L40 110 L10 60 Z"
            />
            <text class="label">Antártida</text>
          </g>
        </g>
      </svg>

      <div class="info" id="info">
        <!-- Footer area simplified: only a Reiniciar button here (top button remains) -->
        <button id="reset-bottom">Reiniciar</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
